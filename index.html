<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS://BUILD — 25-Level JavaScript Challenge</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root {
            --bg: #08080f; --bg2: #10101c; --bg3: #181828;
            --text: #ddd8f0; --dim: #5a5a80; --dimlt: #8888a8;
            --accent: #ff8c00; --accent-d: #c06000;
            --green: #22c55e; --red: #ef4444; --blue: #60a5fa;
            --border: rgba(255, 140, 0, 0.15);
        }

        /* ANTI-COPY PROTECTION */
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        #topbar {
            background: var(--bg2); border-bottom: 1px solid var(--border);
            padding: 0 20px; display: flex; align-items: center; height: 54px; gap: 20px;
        }
        #logo { font-weight: bold; color: var(--accent); letter-spacing: 2px; font-family: monospace; }
        #dots { display: flex; gap: 4px; flex: 1; justify-content: center; }
        .dot { width: 10px; height: 10px; background: var(--bg3); border-radius: 2px; border: 1px solid var(--border); }
        .dot.active { border-color: var(--accent); background: var(--accent-d); }
        .dot.done { background: var(--accent); }

        #main { display: grid; grid-template-columns: 400px 1fr; flex: 1; overflow: hidden; }

        #left { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 20px; }
        .badge { background: var(--bg3); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: var(--blue); margin-bottom: 10px; display: inline-block; }
        .box { background: var(--bg3); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
        
        /* Reference box looks like code but can't be copied */
        pre { 
            background: #000; padding: 12px; color: var(--blue); border-radius: 4px; 
            font-family: 'Courier New', monospace; font-size: 13px; border: 1px solid #222;
            pointer-events: none; /* Prevents clicking/selecting */
        }

        #right { display: flex; flex-direction: column; background: #05050a; }
        #code-editor { 
            flex: 1; background: transparent; color: #e0e8ff; 
            font-family: 'Courier New', monospace; font-size: 16px; border: none; 
            outline: none; padding: 25px; resize: none; line-height: 1.6;
        }

        #output { height: 140px; background: #000; border-top: 2px solid var(--bg3); padding: 15px; font-family: monospace; overflow-y: auto; }
        .error { color: var(--red); }
        .success-msg { color: var(--green); font-weight: bold; }

        #controls { padding: 15px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        .btn { padding: 10px 18px; border-radius: 4px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; font-weight: bold; }
        .btn:hover { background: var(--accent); color: #000; }
        #btn-next { background: var(--green); border-color: var(--green); color: #000; display: none; }
        #btn-download { border-color: var(--blue); color: var(--blue); margin-left: auto; display: none; }
    </style>
</head>
<body>

<div id="topbar">
    <div id="logo">JS://BUILD</div>
    <div id="dots"></div>
    <div id="lvl-tag" style="color:var(--accent); font-family: monospace;">LVL 01</div>
</div>

<div id="main">
    <div id="left" class="no-select">
        <span class="badge" id="concept"></span>
        <h1 id="title" style="margin-bottom: 10px;"></h1>
        <p id="story" style="color: var(--dimlt); font-size: 14px; margin-bottom: 10px;"></p>
        
        <div style="font-size: 10px; color: var(--dim); text-transform: uppercase;">// Task</div>
        <div id="task" class="box"></div>
        
        <div style="font-size: 10px; color: var(--dim); text-transform: uppercase;">// Reference (Type this)</div>
        <pre id="reference"></pre>
        
        <div id="hint-box" style="margin-top: 20px; font-size: 12px; color: var(--dimlt); font-style: italic;">
            Note: Copy-paste is disabled. You must type the code to learn the syntax.
        </div>
    </div>

    <div id="right">
        <textarea id="code-editor" spellcheck="false" placeholder="// Start typing here..."></textarea>
        
        <div id="output">
            <div id="console-text" style="color: var(--blue-lt);"></div>
        </div>

        <div id="controls">
            <button class="btn" onclick="runCode()">RUN</button>
            <button class="btn" onclick="checkAnswer()">CHECK & SAVE</button>
            <button class="btn" id="btn-next" onclick="nextLevel()">NEXT LEVEL →</button>
            <button class="btn" id="btn-download" onclick="downloadProject()">DOWNLOAD .HTML</button>
        </div>
    </div>
</div>

<script>
    // This array will store the student's successful code to build the final file
    let studentProjectCode = [];

    const LEVELS = [
        {
            title: "The Foundation",
            concept: "Variables",
            story: "We need to pick a secret number for the player to find. We'll use Math.random.",
            task: "Create the secret number variable.",
            reference: "let secret = Math.floor(Math.random() * 10) + 1;",
            expected: "let secret", // We check if they wrote the line correctly
            starter: ""
        },
        {
            title: "Attempt Tracker",
            concept: "Counters",
            story: "We need to track how many guesses the player has used. Start at 0.",
            task: "Create a variable called 'attempts' and set it to 0.",
            reference: "let attempts = 0;",
            expected: "let attempts = 0",
            starter: ""
        },
        {
            title: "The Logic Gate",
            concept: "Functions",
            story: "Now we need a function to check if a guess is right or wrong.",
            task: "Define the checkGuess function shell.",
            reference: "function checkGuess(guess) {",
            expected: "function checkGuess",
            starter: ""
        },
        {
            title: "Correct Answer",
            concept: "If Statement",
            story: "Inside the function, check if the guess matches the secret.",
            task: "Type the if statement for a correct match.",
            reference: "  if (guess === secret) {",
            expected: "if (guess === secret)",
            starter: "  "
        },
        {
            title: "Success Feedback",
            concept: "Output",
            story: "Tell the player they won!",
            task: "Log the victory message.",
            reference: "    console.log('You win!');",
            expected: "You win!",
            starter: "    "
        },
        {
            title: "Closing the Block",
            concept: "Syntax",
            story: "Every { needs a }.",
            task: "Close the if statement block.",
            reference: "  }",
            expected: "}",
            starter: "  "
        },
        {
            title: "Higher or Lower?",
            concept: "Else If",
            story: "If they didn't get it, check if the guess was too high.",
            task: "Type the else if condition.",
            reference: "  else if (guess > secret) {",
            expected: "else if (guess > secret)",
            starter: "  "
        },
        {
            title: "Too High",
            concept: "Output",
            story: "Give the player a hint.",
            task: "Log the 'Too High' message.",
            reference: "    console.log('Too high!');",
            expected: "Too high!",
            starter: "    "
        },
        {
            title: "The Wrap Up",
            concept: "Function Closing",
            story: "Close the function entirely.",
            task: "Type the final two closing braces.",
            reference: "  }\n}",
            expected: "}",
            starter: ""
        },
        {
            title: "The Test Run",
            concept: "Execution",
            story: "Finally, call your function with a test guess.",
            task: "Call checkGuess with the number 5.",
            reference: "checkGuess(5);",
            expected: "checkGuess(5)",
            starter: ""
        }
        // Add more levels here...
    ];

    let currentLvl = 0;

    function runCode() {
        const code = document.getElementById('code-editor').value;
        const consoleOutput = document.getElementById('console-text');
        consoleOutput.innerHTML = "";
        
        const originalLog = console.log;
        console.log = function(...args) {
            consoleOutput.innerText += args.join(" ") + "\n";
        };

        try {
            // We include previous saved code so variables exist in scope
            const context = studentProjectCode.join("\n") + "\n" + code;
            eval(context);
        } catch (err) {
            consoleOutput.innerHTML = `<span class="error">Syntax Error: ${err.message}</span>`;
        }
        console.log = originalLog;
    }

    function checkAnswer() {
        const code = document.getElementById('code-editor').value;
        const expected = LEVELS[currentLvl].expected;
        const consoleOutput = document.getElementById('console-text');

        if (code.includes(expected)) {
            consoleOutput.innerHTML = `<span class="success-msg">✓ LINE VERIFIED. Code saved to project memory.</span>`;
            document.getElementById('btn-next').style.display = "block";
            document.getElementById(`dot-${currentLvl}`).classList.add('done');
            
            // Save this specific chunk of code
            studentProjectCode[currentLvl] = code;

            if (currentLvl === LEVELS.length - 1) {
                document.getElementById('btn-download').style.display = "block";
            }
        } else {
            consoleOutput.innerHTML = `<span class="error">× LOGIC MISMATCH. Please type the code exactly as shown in the reference.</span>`;
        }
    }

    function loadLevel(idx) {
        const data = LEVELS[idx];
        document.getElementById('title').innerText = data.title;
        document.getElementById('concept').innerText = `MODULE: ${data.concept}`;
        document.getElementById('story').innerText = data.story;
        document.getElementById('task').innerText = data.task;
        document.getElementById('reference').innerText = data.reference;
        document.getElementById('code-editor').value = data.starter;
        document.getElementById('console-text').innerText = "Awaiting input...";
        document.getElementById('btn-next').style.display = "none";
        document.getElementById('lvl-tag').innerText = `LVL ${idx + 1}`;
        
        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.remove('active');
            if (i === idx) d.classList.add('active');
        });
    }

    function nextLevel() {
        currentLvl++;
        if (currentLvl < LEVELS.length) {
            loadLevel(currentLvl);
        }
    }

    function downloadProject() {
        const finalCode = `
<!DOCTYPE html>
<html>
<head><title>My JS Game</title></head>
<body>
    <h1>Check the Console (F12) to play!</h1>
    <script>
    // Built with JS://BUILD
    ${studentProjectCode.join("\n")}
    <\/script>
</body>
</html>`;
        
        const blob = new Blob([finalCode], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'my_javascript_game.html';
        a.click();
    }

    // Init Dots
    const dotContainer = document.getElementById('dots');
    LEVELS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = `dot-${i}`;
        dotContainer.appendChild(d);
    });

    loadLevel(0);
</script>
</body>
</html>
