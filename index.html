<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JS://BUILD — 25-Level JavaScript Challenge</title>
<style>
/* ── THEME & VARIABLES ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--bg2:#10101c;--bg3:#181828;--bg4:#1e1e30;
  --text:#ddd8f0;--dim:#5a5a80;--dimlt:#8888a8;
  --accent:#ff8c00;--accent-d:#c06000;--accent-dk:#3a2000;--accent-lt:#ffb347;
  --green:#22c55e;--green-dk:#052e16;--green-lt:#bbf7d0;
  --red:#ef4444;--red-dk:#2a0000;--red-lt:#fecaca;
  --blue:#60a5fa;--blue-dk:#0c1a3a;--blue-lt:#dbeafe;
  --border:rgba(255,140,0,0.15);--border2:rgba(255,140,0,0.32);
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;min-height:100vh;overflow-x:hidden}

/* ── LAYOUT ── */
#topbar{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 20px;
  display:flex;align-items:center;gap:16px;height:54px;position:sticky;top:0;z-index:100}
#logo{font-family:'Courier New',monospace;font-size:15px;color:var(--accent);font-weight:bold;letter-spacing:2px}
#progress-wrap{flex:1; max-width: 400px;}
#dots{display:flex;gap:4px;}
.dot{width:12px;height:12px;border-radius:2px;background:var(--bg3);border:1px solid var(--border);transition:0.3s}
.dot.done{background:var(--accent)}
.dot.active{background:var(--accent-d);border-color:var(--accent);box-shadow:0 0 10px var(--accent-d)}

#wrap{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 54px)}

/* ── PANELS ── */
#left{background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
#level-header{padding:20px;background:var(--bg3);border-bottom:1px solid var(--border)}
#left-body{padding:20px;flex:1}
.section-lbl{font-size:10px;color:var(--dim);letter-spacing:2px;margin:15px 0 5px;text-transform:uppercase}

#right{display:flex;flex-direction:column;background:#05050a}
#editor-area{flex:1;position:relative;display:flex;flex-direction:column}
#code-editor{flex:1;background:#0b0b18;color:#e0e8ff;font-family:'Courier New',monospace;font-size:15px;
  padding:20px;border:none;outline:none;resize:none;line-height:1.6}

/* ── UI ELEMENTS ── */
#instruction-box{background:var(--bg3);padding:15px;border-radius:6px;font-size:14px;border:1px solid var(--border)}
#template-box{background:#000;padding:12px;color:var(--blue);font-family:monospace;margin-top:5px;border-radius:4px;white-space:pre}
#output-panel{background:#000;height:180px;border-top:2px solid var(--bg3);overflow-y:auto;padding:15px;font-family:monospace}
#feedback{padding:10px 20px;font-weight:bold;display:none}
.pass{display:block !important;background:var(--green-dk);color:var(--green-lt)}
.fail{display:block !important;background:var(--red-dk);color:var(--red-lt)}

.tbtn{padding:10px 20px;cursor:pointer;border:1px solid var(--accent);background:none;color:var(--accent);font-weight:bold;border-radius:4px}
.tbtn:hover{background:var(--accent);color:#000}
#next-btn{background:var(--green);color:#000;border-color:var(--green);display:none}
</style>
</head>
<body>

<div id="topbar">
  <div id="logo">JS://BUILD</div>
  <div id="progress-wrap">
    <div id="dots"></div>
  </div>
  <div id="level-display" style="color:var(--accent); font-weight:bold">LEVEL 01</div>
</div>

<div id="wrap">
  <div id="left">
    <div id="level-header">
      <div id="level-title" style="font-size:22px; color:var(--blue)">Hello, World!</div>
      <div id="concept-badge" style="color:var(--dimlt); font-size:12px">console.log()</div>
    </div>
    <div id="left-body">
      <div class="section-lbl">// MISSION</div>
      <div id="story-text" style="font-size:14px; line-height:1.6"></div>
      <div class="section-lbl">// INSTRUCTIONS</div>
      <div id="instruction-box"></div>
      <div class="section-lbl">// REFERENCE CODE</div>
      <div id="template-box"></div>
      <div class="section-lbl">// EXPECTED OUTPUT</div>
      <div id="expected-box" style="color:var(--green)"></div>
    </div>
  </div>

  <div id="right">
    <div id="editor-area">
      <textarea id="code-editor" spellcheck="false" placeholder="// Type code here..."></textarea>
    </div>
    <div id="feedback"></div>
    <div id="toolbar" style="padding:15px; background:var(--bg2); display:flex; gap:10px">
      <button class="tbtn" onclick="runCode()">▶ RUN CODE</button>
      <button class="tbtn" onclick="checkCode()">✓ CHECK ANSWER</button>
      <button class="tbtn" id="next-btn" onclick="nextLevel()">NEXT LEVEL →</button>
    </div>
    <div id="output-panel">
      <div style="color:var(--dim); font-size:10px; margin-bottom:5px">// SYSTEM OUTPUT</div>
      <div id="output-text" style="color:var(--blue-lt); white-space:pre-wrap">Press RUN to see output...</div>
    </div>
  </div>
</div>

<script>
// ── DATA: THE LEVELS ──
const LEVELS = [
  {
    level: 1,
    title: "Hello, World!",
    concept: "console.log()",
    story: "Every coder starts here. Use the computer's voice to say hello.",
    task: "Type the code below exactly. Don't forget the quotes!",
    template: 'console.log("Hello, World!");',
    starter: "// Type below:\n",
    expected: "Hello, World!",
  },
  {
    level: 2,
    title: "The Box (Variables)",
    concept: "let",
    story: "Variables store data. Think of 'let' as labeling a box.",
    task: "Create a variable named 'hero' and assign it the name 'Alex'.",
    template: 'let hero = "Alex";\nconsole.log(hero);',
    starter: "// Create variable:\n",
    expected: "Alex",
  },
  {
    level: 3,
    title: "Math Power",
    concept: "Operators",
    story: "Computers are great at math. Let's add some points.",
    task: "Set score to 5, then add 10 to it.",
    template: 'let score = 5;\nscore = score + 10;\nconsole.log(score);',
    starter: "// Do some math:\n",
    expected: "15",
  }
  // Add more levels here...
];

let currentIdx = 0;

// ── COMPILER ENGINE ──
function runCode() {
    const code = document.getElementById('code-editor').value;
    const outputDiv = document.getElementById('output-text');
    outputDiv.innerText = ""; // Clear
    
    // Capture console.log
    const originalLog = console.log;
    console.log = function(...args) {
        outputDiv.innerText += args.join(" ") + "\n";
    };

    try {
        eval(code);
    } catch (err) {
        outputDiv.innerText = "ERROR: " + err.message;
    }

    console.log = originalLog; // Restore console
}

function checkCode() {
    runCode();
    const output = document.getElementById('output-text').innerText.trim();
    const expected = LEVELS[currentIdx].expected.trim();
    const feedback = document.getElementById('feedback');
    const nextBtn = document.getElementById('next-btn');

    if (output === expected) {
        feedback.innerText = "SUCCESS! Access Granted.";
        feedback.className = "pass";
        nextBtn.style.display = "block";
        document.querySelectorAll('.dot')[currentIdx].classList.add('done');
    } else {
        feedback.innerText = "FAIL! Output does not match. Try again.";
        feedback.className = "fail";
        nextBtn.style.display = "none";
    }
}

function nextLevel() {
    currentIdx++;
    if (currentIdx < LEVELS.length) {
        loadLevel(currentIdx);
    } else {
        alert("CHALLENGE COMPLETE! You are a JS Master.");
    }
}

function loadLevel(idx) {
    const lvl = LEVELS[idx];
    document.getElementById('level-display').innerText = "LEVEL " + (lvl.level < 10 ? "0" + lvl.level : lvl.level);
    document.getElementById('level-title').innerText = lvl.title;
    document.getElementById('concept-badge').innerText = lvl.concept;
    document.getElementById('story-text').innerText = lvl.story;
    document.getElementById('instruction-box').innerText = lvl.task;
    document.getElementById('template-box').innerText = lvl.template;
    document.getElementById('expected-box').innerText = "Expected: " + lvl.expected;
    document.getElementById('code-editor').value = lvl.starter;
    document.getElementById('feedback').style.display = "none";
    document.getElementById('next-btn').style.display = "none";
    document.getElementById('output-text').innerText = "System ready...";
    
    // Update Progress Dots
    const dots = document.querySelectorAll('.dot');
    dots.forEach((d, i) => {
        d.classList.remove('active');
        if(i === idx) d.classList.add('active');
    });
}

// ── INITIALIZE ──
const dotContainer = document.getElementById('dots');
LEVELS.forEach((_, i) => {
    const dot = document.createElement('div');
    dot.className = 'dot';
    dotContainer.appendChild(dot);
});

loadLevel(0);
</script>
</body>
</html>
