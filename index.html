<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS://BUILD — 25-Level JavaScript Challenge</title>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root {
            --bg: #08080f; --bg2: #10101c; --bg3: #181828;
            --text: #ddd8f0; --dim: #5a5a80; --dimlt: #8888a8;
            --accent: #ff8c00; --accent-d: #c06000;
            --green: #22c55e; --red: #ef4444; --blue: #60a5fa;
            --border: rgba(255, 140, 0, 0.15);
        }

        .no-select { user-select: none; -webkit-user-select: none; pointer-events: none; }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'Segoe UI', sans-serif;
            height: 100vh; display: flex; flex-direction: column; overflow: hidden;
        }

        #topbar {
            background: var(--bg2); border-bottom: 1px solid var(--border);
            padding: 0 20px; display: flex; align-items: center; height: 54px; gap: 20px;
        }
        #logo { font-weight: bold; color: var(--accent); letter-spacing: 2px; font-family: monospace; }
        #dots { display: flex; gap: 4px; flex: 1; justify-content: center; }
        .dot { width: 10px; height: 10px; background: var(--bg3); border-radius: 2px; border: 1px solid var(--border); }
        .dot.active { border-color: var(--accent); background: var(--accent-d); box-shadow: 0 0 5px var(--accent); }
        .dot.done { background: var(--accent); }

        #main { display: grid; grid-template-columns: 400px 1fr; flex: 1; overflow: hidden; }

        #left { background: var(--bg2); border-right: 1px solid var(--border); overflow-y: auto; padding: 25px; }
        .badge { background: var(--bg3); padding: 4px 8px; border-radius: 4px; font-size: 11px; color: var(--blue); margin-bottom: 10px; display: inline-block; }
        .box { background: var(--bg3); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin: 10px 0; font-size: 14px; line-height: 1.6; }
        
        pre { 
            background: #000; padding: 12px; color: var(--blue); border-radius: 4px; 
            font-family: 'Courier New', monospace; font-size: 15px; border: 1px solid #333;
            margin-bottom: 10px;
        }

        #right { display: flex; flex-direction: column; background: #05050a; }
        #code-editor { 
            flex: 1; background: transparent; color: #e0e8ff; 
            font-family: 'Courier New', monospace; font-size: 18px; border: none; 
            outline: none; padding: 30px; resize: none; line-height: 1.6; caret-color: var(--accent);
        }

        #output { height: 160px; background: #000; border-top: 2px solid var(--bg3); padding: 15px; font-family: monospace; overflow-y: auto; }
        .error { color: var(--red); font-weight: bold; }
        .success-msg { color: var(--green); font-weight: bold; }

        #controls { padding: 15px; background: var(--bg2); border-top: 1px solid var(--border); display: flex; gap: 12px; }
        .btn { padding: 12px 20px; border-radius: 4px; border: 1px solid var(--accent); background: none; color: var(--accent); cursor: pointer; font-weight: bold; font-family: monospace; }
        .btn:hover { background: var(--accent); color: #000; }
        #btn-next { background: var(--green); border-color: var(--green); color: #000; display: none; }
        
        /* Help visual for common syntax errors */
        #syntax-help { font-size: 11px; color: var(--dimlt); margin-top: 10px; border-top: 1px solid var(--bg3); padding-top: 10px; }
    </style>
</head>
<body>

<div id="topbar">
    <div id="logo">JS://BUILD</div>
    <div id="dots"></div>
    <div id="lvl-tag" style="color:var(--accent); font-family: monospace;">LVL 01</div>
</div>

<div id="main">
    <div id="left">
        <span class="badge" id="concept"></span>
        <h1 id="title" style="margin-bottom: 10px;"></h1>
        <p id="story" style="color: var(--dimlt); font-size: 14px; margin-bottom: 15px;"></p>
        
        <div style="font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px;">// Mission Task</div>
        <div id="task" class="box"></div>
        
        <div style="font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px;">// Reference (Type Carefully)</div>
        <pre id="reference" class="no-select"></pre>
        
        <div id="syntax-help">
            <strong>Key Check:</strong> <span style="color:var(--accent)">{ }</span> are Curly Braces (Logic blocks). <span style="color:var(--blue)"> ( ) </span> are Parentheses (Conditions).
        </div>
    </div>

    <div id="right">
        <textarea id="code-editor" spellcheck="false" placeholder="// Initializing terminal..."></textarea>
        
        <div id="output">
            <div id="console-text" style="color: var(--blue-lt); font-size: 14px;"></div>
        </div>

        <div id="controls">
            <button class="btn" onclick="runCode()">RUN CODE</button>
            <button class="btn" onclick="checkAnswer()">CHECK & SAVE</button>
            <button class="btn" id="btn-next" onclick="nextLevel()">NEXT LEVEL →</button>
            <button class="btn" id="btn-dl" style="margin-left:auto; display:none;" onclick="downloadProject()">DOWNLOAD GAME</button>
        </div>
    </div>
</div>

<script>
    let studentProjectCode = [];

    const LEVELS = [
        {
            title: "The Variable",
            concept: "Variables",
            story: "We need to pick a number between 1 and 10. We'll store it in a variable.",
            task: "Create the secret number variable.",
            reference: "let secret = 7;",
            validate: (input) => input.includes("let secret") && input.includes("7"),
            starter: "let secret = "
        },
        {
            title: "The Function",
            concept: "Logic Blocks",
            story: "A function is a box of code that performs a task. We need one to check guesses.",
            task: "Start the function definition.",
            reference: "function check(guess) {",
            validate: (input) => input.includes("function") && input.includes("{"),
            starter: "function check(guess) "
        },
        {
            title: "The Comparison",
            concept: "If Statements",
            story: "Inside the function, we check if the guess is the same as the secret.",
            task: "Type the comparison line.",
            reference: "  if (guess === secret) {",
            validate: (input) => input.includes("if") && input.includes("===") && input.includes("{"),
            starter: "  if ("
        },
        {
            title: "Success Message",
            concept: "Strings",
            story: "If they are equal, we should tell the player they won.",
            task: "Use console.log to print a victory message.",
            reference: "    console.log('Win!');",
            validate: (input) => input.includes("console.log") && input.includes("Win"),
            starter: "    console.log('"
        },
        {
            title: "Closing the If",
            concept: "Syntax: Braces",
            story: "We must close the 'if' block before we do anything else.",
            task: "Type a single closing curly brace.",
            reference: "  }",
            validate: (input) => input.trim() === "}",
            starter: ""
        },
        {
            title: "The Alternative",
            concept: "Else Statements",
            story: "If the guess wasn't correct, the 'else' block will run instead.",
            task: "Start the else block.",
            reference: "  else {",
            validate: (input) => input.includes("else") && input.includes("{"),
            starter: "  else "
        },
        {
            title: "Failure Message",
            concept: "Output",
            story: "Tell the player to try again.",
            task: "Log 'Try again'.",
            reference: "    console.log('Try again');",
            validate: (input) => input.includes("Try again"),
            starter: "    "
        },
        {
            title: "Closing the Else",
            concept: "Syntax: Braces",
            story: "Now close the 'else' block.",
            task: "Type a closing curly brace.",
            reference: "  }",
            validate: (input) => input.trim() === "}",
            starter: ""
        },
        {
            title: "Finalizing",
            concept: "Closing Functions",
            story: "The function itself needs to be closed to complete the file.",
            task: "Type the final closing curly brace.",
            reference: "}",
            validate: (input) => input.trim() === "}",
            starter: ""
        },
        {
            title: "The Final Test",
            concept: "Execution",
            story: "Run your function with a guess of 7 to see if it works!",
            task: "Call your function.",
            reference: "check(7);",
            validate: (input) => input.includes("check(7)"),
            starter: ""
        }
        // You can easily add levels 11-25 following this pattern
    ];

    let currentLvl = 0;

    function runCode() {
        const currentCode = document.getElementById('code-editor').value;
        const consoleOutput = document.getElementById('console-text');
        consoleOutput.innerText = "";
        
        const originalLog = console.log;
        console.log = function(...args) {
            consoleOutput.innerText += args.join(" ") + "\n";
        };

        try {
            // "Sanity Check" Logic: 
            // We combine all previous saved code with current code.
            // If the code is just a brace (Level 5, 8, 9), we don't 'eval' 
            // because it will always throw a syntax error until the script is finished.
            const fullScript = studentProjectCode.join("\n") + "\n" + currentCode;
            
            // Only eval if the code is a complete statement (doesn't end in { or else)
            if (!currentCode.trim().endsWith("{") && !currentCode.trim().endsWith("else")) {
                eval(fullScript);
            } else {
                consoleOutput.innerText = "System: Logic block opened. Ready for next line...";
            }
        } catch (err) {
            // We suppress scary browser errors and show a "Student Friendly" one
            consoleOutput.innerHTML = `<span class="error">Status: Incomplete Logic.</span><br><small style="color:var(--dimlt)">Note: Some lines don't work until they are closed with a }.</small>`;
        }
        console.log = originalLog;
    }

    function checkAnswer() {
        const input = document.getElementById('code-editor').value;
        const level = LEVELS[currentLvl];
        const consoleOutput = document.getElementById('console-text');

        // Validation check using the function provided in the level data
        if (level.validate(input)) {
            consoleOutput.innerHTML = `<span class="success-msg">✓ MODULE ${currentLvl + 1} VERIFIED. Code synced to project memory.</span>`;
            document.getElementById('btn-next').style.display = "block";
            document.getElementById(`dot-${currentLvl}`).classList.add('done');
            
            // Save the exact code they typed
            studentProjectCode[currentLvl] = input;

            if (currentLvl === LEVELS.length - 1) {
                document.getElementById('btn-dl').style.display = "block";
            }
        } else {
            consoleOutput.innerHTML = `<span class="error">× SYNTAX ERROR: Check your characters against the reference. (Did you use ) instead of } ?)</span>`;
        }
    }

    function loadLevel(idx) {
        const data = LEVELS[idx];
        document.getElementById('title').innerText = data.title;
        document.getElementById('concept').innerText = `PHASE: ${data.concept}`;
        document.getElementById('story').innerText = data.story;
        document.getElementById('task').innerText = data.task;
        document.getElementById('reference').innerText = data.reference;
        document.getElementById('code-editor').value = data.starter;
        document.getElementById('console-text').innerText = "Terminal online...";
        document.getElementById('btn-next').style.display = "none";
        document.getElementById('lvl-tag').innerText = `LVL ${idx + 1}`;
        
        document.querySelectorAll('.dot').forEach((d, i) => {
            d.classList.remove('active');
            if (i === idx) d.classList.add('active');
        });
    }

    function nextLevel() {
        currentLvl++;
        if (currentLvl < LEVELS.length) {
            loadLevel(currentLvl);
        }
    }

    function downloadProject() {
    const projectBody = studentProjectCode.join("\n");
    const template = `<!DOCTYPE html>
<html>
<head>
    <title>JS://BUILD Final Project</title>
    <style>
        body { background: #08080f; color: #ddd8f0; font-family: 'Courier New', monospace; padding: 40px; }
        #display { 
            background: #000; border: 1px solid #ff8c00; padding: 20px; 
            border-radius: 8px; min-height: 200px; white-space: pre-wrap;
            box-shadow: 0 0 15px rgba(255, 140, 0, 0.2); color: #60a5fa;
        }
        h1 { color: #ff8c00; font-size: 18px; letter-spacing: 2px; }
        .system-note { color: #5a5a80; font-size: 12px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>> GAME_MODULE_LOADED</h1>
    <div id="display">Initializing...</div>
    <p class="system-note">This code was built line-by-line in JS://BUILD.</p>

    <script>
        // Virtual Terminal Redirect
        const display = document.getElementById('display');
        display.innerText = "";
        console.log = function(...args) {
            display.innerText += args.join(" ") + "\\n";
        };

        /* --- STUDENT CODE START --- */
        try {
            ${projectBody}
        } catch (err) {
            display.innerText = "RUNTIME ERROR: " + err.message;
        }
        /* --- STUDENT CODE END --- */
    <\/script>
</body>
</html>`;
    
    const blob = new Blob([template], { type: 'text/html' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'my_javascript_game.html';
    a.click();
}

    // Generate Progress Dots
    const dotContainer = document.getElementById('dots');
    LEVELS.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'dot';
        d.id = `dot-${i}`;
        dotContainer.appendChild(d);
    });

    loadLevel(0);
</script>
</body>
</html>
